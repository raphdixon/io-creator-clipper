  <script>
    (function() {
      const EVENTS = {
        artemis2: {
          id: 'artemis2',
          title: 'NASA Artemis II Moon Launch',
          transcriptTitle: 'Launch Transcript',
          isLive: true,
          duration: 192,
          trueIsoSync: true,
          defaultQuery: 'Artemis',
          defaultIn: 14,
          defaultOut: 25,
          quickTopics: ['Artemis', 'liftoff', 'Integrity', 'Houston', 'supersonic', 'separation'],
          transcriptUrl: '/media/artemis2/transcript.json',
          thumbCount: 60,
          thumbPath: (idx) => '/media/artemis2/thumbs/thumb_' + String(idx).padStart(2, '0') + '.jpg',
          exportUrl: (camId, ar) => '/media/artemis2/exports/export_' + camId + '_' + ar + '.mp4',
          cameras: [
            { id: 'cam1', code: 'CAMERA 1', short: 'CAM 1', name: 'Pad 39B Wide', src: '/media/artemis2/cam3-wide.mp4' },
            { id: 'cam2', code: 'CAMERA 2', short: 'CAM 2', name: 'Rocket Onboard', src: '/media/artemis2/cam1-onboard.mp4' },
            { id: 'cam3', code: 'CAMERA 3', short: 'CAM 3', name: '8K Chase Plane', src: '/media/artemis2/cam2-aerial.mp4' },
            { id: 'cam4', code: 'CAMERA 4', short: 'CAM 4', name: 'VIP Crowd', src: '/media/artemis2/cam4-crowd.mp4' }
          ],
          chapters: [
            { start: 0, end: 28, label: '01 • Ignition & Liftoff' },
            { start: 28, end: 85, label: '02 • Roll Pitch & Houston' },
            { start: 85, end: 128, label: '03 • Max-Q & Supersonic' },
            { start: 128, end: 161, label: '04 • Booster Separation' },
            { start: 161, end: 192, label: '05 • Upper Stage Ascent' }
          ],
          starterExports: [
            { id: 'art_ex1', start: 14, end: 25, cam: 'cam1', text: 'Booster ignition and liftoff! The crew of Artemis II, now bound for the Moon!', selected: true },
            { id: 'art_ex2', start: 141, end: 155, cam: 'cam2', text: 'Confirm separation! Main engines throttling up. Guidance converged.', selected: true }
          ]
        }
      };

      let activeEventKey = 'artemis2';
      let ev = EVENTS[activeEventKey];
      let transcript = [];
      let matches = [];
      let currentQuery = ev.defaultQuery;
      let clipIn = ev.defaultIn;
      let clipOut = ev.defaultOut;
      let desiredTime = ev.defaultIn;
      let playbackMode = 'clip'; // 'clip' (loops active In->Out) or 'full' (continuous stream)
      let selectedCam = 'cam1';
      let exportCam = 'cam1';
      let exportAr = '16x9';
      let exportArLabel = '16:9';
      let quadMode = false;
      let exportOpen = false;
      let showSpeakers = true;
      let exportQueue = [];
      let activeClipId = null;

      // DOM References
      const clipperTop = document.getElementById('clipperTop');
      const searchInput = document.getElementById('searchInput');
      const matchCountLabel = document.getElementById('matchCountLabel');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const transcriptList = document.getElementById('transcriptList');
      const multicamCanvas = document.getElementById('multicamCanvas');
      const eventTitleText = document.getElementById('eventTitleText');
      const stageTimecode = document.getElementById('stageTimecode');
      const liveSubtitleText = document.getElementById('liveSubtitleText');
      const camDropdownBtn = document.getElementById('camDropdownBtn');
      const camTriggerCode = document.getElementById('camTriggerCode');
      const camTriggerName = document.getElementById('camTriggerName');
      const camSwitcherMenu = document.getElementById('camSwitcherMenu');
      const camMenuOptions = document.getElementById('camMenuOptions');
      const quadToggleMenuBtn = document.getElementById('quadToggleMenuBtn');
      const playInOutBtn = document.getElementById('playInOutBtn');
      const playInOutIcon = document.getElementById('playInOutIcon');
      const playInOutLabel = document.getElementById('playInOutLabel');
      const watchFullBtn = document.getElementById('watchFullBtn');
      const toggleExportBtn = document.getElementById('toggleExportBtn');
      const exportChevron = document.getElementById('exportChevron');
      const exportCountBadge = document.getElementById('exportCountBadge');
      const exportClipsGrid = document.getElementById('exportClipsGrid');
      const selectAllBtn = document.getElementById('selectAllBtn');
      const selectAllDot = document.getElementById('selectAllDot');
      const exportAspectSelect = document.getElementById('exportAspectSelect');
      const exportCamSelect = document.getElementById('exportCamSelect');
      const advancedToggleBtn = document.getElementById('advancedToggleBtn');
      const advancedDrawer = document.getElementById('advancedDrawer');
      const cropFrameLive = document.getElementById('cropFrameLive');
      const cropPreviewVideo = document.getElementById('cropPreviewVideo');
      const downloadClipsBtn = document.getElementById('downloadClipsBtn');
      const downloadClipsLabel = document.getElementById('downloadClipsLabel');
      const timelineTrack = document.getElementById('timelineTrack');
      const chaptersBar = document.getElementById('chaptersBar');
      const filmstripTrack = document.getElementById('filmstripTrack');
      const matchesLayer = document.getElementById('matchesLayer');
      const clipsLayer = document.getElementById('clipsLayer');
      const playheadNeedle = document.getElementById('playheadNeedle');
      const timelineClockReadout = document.getElementById('timelineClockReadout');
      const hoverLoupe = document.getElementById('hoverLoupe');
      const loupeImg = document.getElementById('loupeImg');
      const loupeTime = document.getElementById('loupeTime');
      const loupeSpeaker = document.getElementById('loupeSpeaker');
      const loupeCaption = document.getElementById('loupeCaption');

      const vids = {
        cam1: document.getElementById('vid_cam1'),
        cam2: document.getElementById('vid_cam2'),
        cam3: document.getElementById('vid_cam3'),
        cam4: document.getElementById('vid_cam4')
      };

      // Hidden master audio/clock element when event uses separate master audio
      const masterMedia = new Audio();
      masterMedia.preload = 'auto';

      const blobCache = {};

      function ensureSeekableMedia(el, srcUrl, onUpgraded) {
        if (!el || !srcUrl || srcUrl.startsWith('blob:') || el.dataset.blobUpgrading === srcUrl) return;
        if (blobCache[srcUrl]) {
          el.dataset.blobUpgrading = srcUrl;
          el.src = blobCache[srcUrl];
          el.load();
          return;
        }
        el.dataset.blobUpgrading = srcUrl;
        fetch(srcUrl)
          .then(r => (r.ok ? r.blob() : null))
          .then(blob => {
            if (!blob) return;
            const bUrl = URL.createObjectURL(blob);
            blobCache[srcUrl] = bUrl;
            if (el.dataset.origSrc === srcUrl) {
              const wasPlaying = !el.paused;
              el.src = bUrl;
              el.onloadedmetadata = () => {
                if (onUpgraded) onUpgraded();
                if (wasPlaying) el.play().catch(() => {});
              };
              el.load();
            }
          })
          .catch(() => {});
      }

      function canMediaSeek(el) {
        return Boolean(el && el.readyState >= 1 && el.seekable && el.seekable.length > 0 && el.seekable.end(el.seekable.length - 1) > 1);
      }

      function getPrimaryClockMedia() {
        return ev.trueIsoSync ? vids.cam1 : masterMedia;
      }

      function getCurrentTime() {
        const c = getPrimaryClockMedia();
        if (!c || c.readyState < 1 || c.seeking || !canMediaSeek(c)) {
          return desiredTime;
        }
        return c.currentTime;
      }

      function isPaused() {
        return getPrimaryClockMedia().paused;
      }

      function fmtTime(sec) {
        const clamped = Math.max(0, Math.min(ev.duration, sec || 0));
        const m = Math.floor(clamped / 60);
        const s = Math.floor(clamped % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function getThumbForTime(sec) {
        const ratio = Math.max(0, Math.min(0.999, (sec || 0) / ev.duration));
        const idx = Math.max(1, Math.min(ev.thumbCount, Math.floor(ratio * ev.thumbCount) + 1));
        return ev.thumbPath(idx);
      }

      // Sync all 4 camera video elements to master clock (genlock-style micro-rate lock during playback)
      function syncCamerasToTime(targetSec, forceSeek) {
        const clock = getPrimaryClockMedia();
        if (forceSeek && canMediaSeek(clock) && Math.abs((clock.currentTime || 0) - targetSec) > 0.02) {
          clock.currentTime = targetSec;
        } else if (forceSeek && clock && clock.readyState >= 1 && !canMediaSeek(clock)) {
          ensureSeekableMedia(clock, clock.dataset.origSrc, () => syncCamerasToTime(desiredTime, true));
        }
        ev.cameras.forEach((cam) => {
          const v = vids[cam.id];
          if (!v || v.readyState < 1 || !v.duration) return;
          if (!canMediaSeek(v)) {
            ensureSeekableMedia(v, v.dataset.origSrc, () => syncCamerasToTime(desiredTime, true));
            return;
          }
          if (ev.trueIsoSync) {
            const clampedT = Math.min(v.duration - 0.05, Math.max(0, targetSec));
            if (cam.id === 'cam1') {
              if (forceSeek && Math.abs(v.currentTime - clampedT) > 0.02) {
                v.currentTime = clampedT;
              }
              return;
            }
            const diff = v.currentTime - clampedT;
            const absDiff = Math.abs(diff);
            if (forceSeek || absDiff > 0.28) {
              v.currentTime = clampedT;
              if (v.playbackRate !== 1.0) v.playbackRate = 1.0;
            } else if (!v.paused && absDiff > 0.035) {
              v.playbackRate = diff > 0 ? 0.96 : 1.04;
            } else if (v.playbackRate !== 1.0) {
              v.playbackRate = 1.0;
            }
          } else {
            const modT = targetSec % v.duration;
            if (forceSeek || Math.abs(v.currentTime - modT) > 0.35) {
              v.currentTime = modT;
            }
          }
        });
      }

      let rafId = null;
      function startSmoothTicker() {
        if (rafId) cancelAnimationFrame(rafId);
        function step() {
          if (isPaused()) {
            rafId = null;
            return;
          }
          onClockTick();
          rafId = requestAnimationFrame(step);
        }
        rafId = requestAnimationFrame(step);
      }

      function playAllSynced() {
        const clock = getPrimaryClockMedia();
        syncCamerasToTime(getCurrentTime(), true);
        clock.play().catch(() => {});
        ev.cameras.forEach((cam) => {
          const v = vids[cam.id];
          if (v && v !== clock) {
            v.play().catch(() => {});
          }
        });
        updateTransportButtons();
        startSmoothTicker();
      }

      function pauseAllSynced() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        const clock = getPrimaryClockMedia();
        clock.pause();
        ev.cameras.forEach((cam) => {
          const v = vids[cam.id];
          if (v) {
            v.pause();
            if (v.playbackRate !== 1.0) v.playbackRate = 1.0;
          }
        });
        updateTransportButtons();
      }

      function seekTo(sec) {
        const clamped = Math.max(0, Math.min(ev.duration, sec));
        desiredTime = clamped;
        syncCamerasToTime(clamped, true);
        updatePlayheadUI(clamped);
      }

      function updateTransportButtons() {
        const playing = !isPaused();
        if (playing && playbackMode === 'clip') {
          playInOutIcon.textContent = '❚❚';
          playInOutLabel.textContent = 'Pause In → Out';
        } else {
          playInOutIcon.textContent = '▶';
          playInOutLabel.textContent = 'Play In → Out';
        }
        watchFullBtn.classList.toggle('active', playing && playbackMode === 'full');
        document.getElementById('watchBtnLabel').textContent =
          (playing && playbackMode === 'full') ? 'Pause Stream' : (ev.isLive ? 'Watch Live' : 'Full Stream');
      }

      // Load an Event into Stage, Transcript, Timeline, and Export Queue
      async function loadEvent(eventKey) {
        pauseAllSynced();
        activeEventKey = eventKey;
        ev = EVENTS[eventKey];
        currentQuery = ev.defaultQuery;
        exportQueue = ev.starterExports.map(x => ({ ...x }));
        activeClipId = exportQueue[0] ? exportQueue[0].id : null;
        clipIn = exportQueue[0] ? exportQueue[0].start : ev.defaultIn;
        clipOut = exportQueue[0] ? exportQueue[0].end : ev.defaultOut;
        desiredTime = clipIn;
        selectedCam = ev.cameras[0].id;
        exportCam = ev.cameras[0].id;

        if (eventTitleText) eventTitleText.textContent = ev.title;
        document.getElementById('transcriptHeading').textContent = ev.transcriptTitle || 'Transcript';
        document.getElementById('liveDot').classList.toggle('ended', !ev.isLive);
        document.getElementById('watchBtnDot').classList.toggle('ended', !ev.isLive);
        searchInput.value = currentQuery;

        ev.cameras.forEach((cam, idx) => {
          const v = vids[cam.id];
          v.dataset.origSrc = cam.src;
          v.dataset.blobUpgrading = '';
          v.src = blobCache[cam.src] || cam.src;
          v.loop = !ev.trueIsoSync;
          v.muted = !(ev.trueIsoSync && idx === 0);
          v.onloadedmetadata = () => {
            const target = isPaused() ? desiredTime : (getCurrentTime() || desiredTime);
            if (!canMediaSeek(v)) {
              ensureSeekableMedia(v, cam.src, () => syncCamerasToTime(desiredTime, true));
              if (idx === 0) updatePlayheadUI(target);
              return;
            }
            if (ev.trueIsoSync) {
              v.currentTime = Math.min(v.duration - 0.05, Math.max(0, target));
            } else {
              v.currentTime = target % v.duration;
            }
            if (idx === 0) updatePlayheadUI(target);
          };
          v.load();
          const slot = multicamCanvas.querySelector('[data-cam="' + cam.id + '"] .q-lbl');
          if (slot) slot.textContent = cam.code + ' · ' + cam.name;
        });

        if (!ev.trueIsoSync && ev.masterAudioSrc) {
          masterMedia.dataset.origSrc = ev.masterAudioSrc;
          masterMedia.dataset.blobUpgrading = '';
          masterMedia.src = blobCache[ev.masterAudioSrc] || ev.masterAudioSrc;
          masterMedia.onloadedmetadata = () => {
            if (!canMediaSeek(masterMedia)) {
              ensureSeekableMedia(masterMedia, ev.masterAudioSrc, () => syncCamerasToTime(desiredTime, true));
              updatePlayheadUI(desiredTime);
              return;
            }
            if (masterMedia.currentTime < 0.5 && desiredTime > 0) {
              masterMedia.currentTime = desiredTime;
              syncCamerasToTime(desiredTime, true);
              updatePlayheadUI(desiredTime);
            }
          };
          masterMedia.load();
        } else {
          masterMedia.removeAttribute('src');
        }

        renderCameraMenus();
        renderTimelineStatic();
        selectCamera(selectedCam, false);

        try {
          const resp = await fetch(ev.transcriptUrl);
          transcript = await resp.json();
        } catch (err) {
          transcript = [];
        }

        runSearch();
        renderTimelineClips();
        renderExportQueue();
        seekTo(clipIn);
        updatePlayheadUI(clipIn);
        scrollTranscriptToActive();
        updateTransportButtons();
      }

      function scrollTranscriptToActive() {
        requestAnimationFrame(() => {
          const target = transcriptList.querySelector('.cue-card.in-clip-range') || transcriptList.querySelector('.cue-card.is-match');
          if (target) {
            transcriptList.scrollTop = Math.max(0, target.offsetTop - transcriptList.offsetTop - 52);
          }
        });
      }

      function renderCameraMenus() {
        camMenuOptions.innerHTML = ev.cameras.map((cam, idx) =>
          '<button type="button" class="cam-option-btn' + (cam.id === selectedCam ? ' active' : '') + '" data-cam="' + cam.id + '">' +
            '<div class="cam-opt-left">' +
              '<span class="cam-opt-code">' + cam.code + '</span>' +
              '<span class="cam-opt-label">' + cam.name + '</span>' +
            '</div>' +
            '<span class="cam-opt-key">' + (idx + 1) + '</span>' +
          '</button>'
        ).join('');

        camMenuOptions.querySelectorAll('.cam-option-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            selectCamera(btn.getAttribute('data-cam'), true);
            camSwitcherMenu.classList.remove('open');
            camDropdownBtn.classList.remove('open');
          });
        });

        exportCamSelect.innerHTML = ev.cameras.map(cam =>
          '<option value="' + cam.id + '"' + (cam.id === exportCam ? ' selected' : '') + '>' + cam.code + '</option>'
        ).concat(['<option value="all">ALL 4 CAMS</option>']).join('');
      }

      function selectCamera(camId, syncExportCam) {
        selectedCam = camId;
        const camObj = ev.cameras.find(c => c.id === camId) || ev.cameras[0];

        camTriggerCode.textContent = camObj.code;
        camTriggerName.textContent = camObj.name;

        multicamCanvas.querySelectorAll('.cam-feed-slot').forEach(slot => {
          slot.classList.toggle('active-cam', slot.getAttribute('data-cam') === camId);
        });

        camMenuOptions.querySelectorAll('.cam-option-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-cam') === camId);
        });

        syncCamerasToTime(getCurrentTime(), true);

        if (syncExportCam) {
          exportCam = camId;
          exportCamSelect.value = camId;
          updateCropPreviewSource();
          updateDownloadButtonLabel();
        } else {
          updateCropPreviewSource();
        }
      }

      function updateCropPreviewSource() {
        const targetCam = exportCam === 'all' ? selectedCam : exportCam;
        const camObj = ev.cameras.find(c => c.id === targetCam) || ev.cameras[0];
        if (!cropPreviewVideo.src.endsWith(camObj.src)) {
          cropPreviewVideo.src = camObj.src;
          cropPreviewVideo.currentTime = ev.trueIsoSync ? clipIn : 0;
          if (advancedDrawer.classList.contains('open')) {
            cropPreviewVideo.play().catch(() => {});
          }
        }
      }

      function renderTimelineStatic() {
        // Chapters
        chaptersBar.innerHTML = ev.chapters.map(ch => {
          const leftPct = (ch.start / ev.duration) * 100;
          return '<div class="chapter-marker" style="left:' + leftPct + '%;">' +
            '<span class="chapter-marker-label" data-start="' + ch.start + '" data-end="' + ch.end + '">' + ch.label + '</span>' +
          '</div>';
        }).join('');

        chaptersBar.querySelectorAll('.chapter-marker-label').forEach(lbl => {
          lbl.addEventListener('click', (e) => {
            e.stopPropagation();
            const s = parseFloat(lbl.getAttribute('data-start'));
            if (s < clipIn || s >= clipOut - 0.1) {
              playbackMode = 'full';
              updateTransportButtons();
            }
            seekTo(s);
          });
        });

        // 24 Filmstrip cells
        let fsHtml = '';
        const cells = 24;
        for (let i = 0; i < cells; i++) {
          const sec = ((i + 0.5) / cells) * ev.duration;
          fsHtml += '<img class="filmstrip-thumb" src="' + getThumbForTime(sec) + '" alt="" />';
        }
        filmstripTrack.innerHTML = fsHtml;
      }

      function matchesTermWordAware(haystack, term) {
        if (!term) return false;
        const esc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (term.length <= 3) {
          return new RegExp('(?:^|[^a-z0-9])' + esc + '(?:$|[^a-z0-9])', 'i').test(haystack);
        }
        return haystack.includes(term);
      }

      function isCueMatch(cue, q) {
        if (!q || !q.trim()) return false;
        const clean = q.trim().toLowerCase();
        const textL = (cue.text || '').toLowerCase();
        const spkL = (cue.speaker || '').toLowerCase();
        const tags = (cue.tags || []).map(t => t.toLowerCase());
        if (matchesTermWordAware(textL, clean) || (clean.length > 3 && spkL.includes(clean))) return true;
        if (tags.some(t => t === clean || (clean.length > 3 && t.includes(clean)))) return true;
        const terms = clean.split(/\s+/).filter(Boolean);
        return terms.length > 1 && terms.every(term =>
          matchesTermWordAware(textL, term) || (term.length > 3 && spkL.includes(term)) || tags.some(t => t === term || (term.length > 3 && t.includes(term)))
        );
      }

      function highlightMatchesInText(text, q) {
        if (!q || !q.trim()) return text;
        const terms = q.trim().split(/\s+/).filter(t => t.length >= 2);
        if (!terms.length) return text;
        const patterns = terms.map(t => {
          const esc = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          return t.length <= 3 ? ('\\b' + esc + '\\b') : esc;
        });
        const re = new RegExp('(' + patterns.join('|') + ')', 'gi');
        return text.replace(re, '<mark>$1</mark>');
      }

      function runSearch() {
        currentQuery = searchInput.value;
        matches = transcript.filter(cue => isCueMatch(cue, currentQuery));

        matchCountLabel.textContent = currentQuery.trim()
          ? matches.length + (matches.length === 1 ? ' match' : ' matches')
          : transcript.length + ' cues';

        renderTimelineMatches();
        renderTranscriptCards();
      }

      function renderTimelineMatches() {
        if (!currentQuery.trim()) {
          matchesLayer.innerHTML = '';
          return;
        }
        matchesLayer.innerHTML = matches.map(cue => {
          const leftPct = (cue.start / ev.duration) * 100;
          const widthPct = Math.max(1.4, ((cue.end - cue.start) / ev.duration) * 100);
          return '<div class="timeline-match-block" style="left:' + leftPct + '%; width:' + widthPct + '%;" ' +
            'data-start="' + cue.start + '" data-end="' + cue.end + '" ' +
            'title="' + cue.timecode + ' · ' + cue.speaker + ': ' + cue.text.replace(/"/g, '&quot;') + '"></div>';
        }).join('');
      }

      function computeClipText(startSec, endSec, customText) {
        if (customText) return customText;
        const cuesInRange = transcript.filter(c => c.end > startSec && c.start < endSec);
        return cuesInRange.length
          ? cuesInRange.map(c => c.text).join(' ')
          : (ev.title + ' (' + fmtTime(startSec) + '–' + fmtTime(endSec) + ')');
      }

      function formatBracketPillText(startSec, endSec, isActive) {
        const widthPct = ((endSec - startSec) / ev.duration) * 100;
        const dur = (endSec - startSec).toFixed(1);
        if (isActive && widthPct >= 8.5) {
          return 'IN ' + fmtTime(startSec) + ' → OUT ' + fmtTime(endSec) + ' (' + dur + 's)';
        }
        return fmtTime(startSec) + ' → ' + fmtTime(endSec);
      }

      function setActiveClip(id, shouldRender) {
        activeClipId = id;
        const found = exportQueue.find(c => c.id === id);
        if (found) {
          clipIn = found.start;
          clipOut = found.end;
        }
        if (shouldRender !== false) {
          renderTimelineClips();
        }
      }

      function removeClipById(id) {
        exportQueue = exportQueue.filter(c => c.id !== id);
        if (activeClipId === id) {
          activeClipId = exportQueue[0] ? exportQueue[0].id : null;
          if (exportQueue[0]) {
            clipIn = exportQueue[0].start;
            clipOut = exportQueue[0].end;
          } else {
            playbackMode = 'full';
            updateTransportButtons();
          }
        }
        renderTimelineClips();
        renderExportQueue();
        renderTranscriptCards();
      }

      function addClipRange(startSec, endSec, customText) {
        const minSpan = 1.5;
        let s = Math.max(0, Math.min(startSec, endSec));
        let end = Math.min(ev.duration, Math.max(startSec, endSec));
        if (end - s < minSpan) {
          end = Math.min(ev.duration, s + minSpan);
          if (end - s < minSpan) s = Math.max(0, end - minSpan);
        }
        const newId = 'clip_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const newClip = {
          id: newId,
          start: Number(s.toFixed(2)),
          end: Number(end.toFixed(2)),
          cam: selectedCam,
          text: computeClipText(s, end, customText),
          selected: true
        };
        exportQueue.push(newClip);
        exportQueue.sort((a, b) => a.start - b.start);
        setActiveClip(newId, false);
        renderTimelineClips();
        renderExportQueue();
        renderTranscriptCards();
        return newClip;
      }

      function renderTimelineClips() {
        clipsLayer.innerHTML = exportQueue.map(item => {
          const isActive = item.id === activeClipId;
          const leftPct = (item.start / ev.duration) * 100;
          const widthPct = Math.max(1.4, ((item.end - item.start) / ev.duration) * 100);
          return '<div class="trim-bracket' + (isActive ? ' is-active' : '') + '" data-id="' + item.id + '" style="left:' + leftPct + '%; width:' + widthPct + '%;">' +
            '<button type="button" class="trim-remove-btn" data-action="remove" title="Remove range" aria-label="Remove range">✕</button>' +
            '<div class="trim-handle in" data-action="in" title="Drag In point">[</div>' +
            '<div class="trim-handle out" data-action="out" title="Drag Out point">]</div>' +
            '<div class="trim-range-pill">' + formatBracketPillText(item.start, item.end, isActive) + '</div>' +
          '</div>';
        }).join('');
      }

      function renderTranscriptCards() {
        if (!transcript.length) {
          transcriptList.innerHTML = '<div style="padding:18px; color:var(--ink-muted); font-size:12px;">Loading transcript...</div>';
          return;
        }
        const curr = getCurrentTime();
        transcriptList.innerHTML = transcript.map(cue => {
          const matched = isCueMatch(cue, currentQuery);
          const inRange = exportQueue.some(cl => cue.end > cl.start && cue.start < cl.end);
          const playing = curr >= cue.start && curr < cue.end;
          const headerLeft = showSpeakers ? (cue.timecode + '  ' + cue.speaker) : cue.timecode;
          return '<div class="cue-card' +
            (matched ? ' is-match' : '') +
            (inRange ? ' in-clip-range' : '') +
            (playing ? ' is-playing' : '') +
            '" data-start="' + cue.start + '" data-end="' + cue.end + '" data-text="' + cue.text.replace(/"/g, '&quot;') + '">' +
              '<div class="cue-header">' +
                '<span>' + headerLeft + '</span>' +
                '<button type="button" class="cue-quick-add" title="Create In/Out clip">+ Clip</button>' +
              '</div>' +
              '<div class="cue-body">' + (matched ? highlightMatchesInText(cue.text, currentQuery) : cue.text) + '</div>' +
            '</div>';
        }).join('');

        transcriptList.querySelectorAll('.cue-card').forEach(card => {
          card.addEventListener('click', (e) => {
            const s = parseFloat(card.getAttribute('data-start'));
            const end = parseFloat(card.getAttribute('data-end'));
            const txt = card.getAttribute('data-text');
            if (e.target.classList.contains('cue-quick-add')) {
              e.stopPropagation();
              const cIn = Math.max(0, s - 1.5);
              const cOut = Math.min(ev.duration, end + 4.5);
              addClipRange(cIn, cOut, txt);
              seekTo(s);
              setExportDrawer(true);
            } else {
              const containing = exportQueue.find(cl => s >= cl.start && s < cl.end);
              if (containing) {
                setActiveClip(containing.id, true);
              } else {
                playbackMode = 'full';
                updateTransportButtons();
              }
              seekTo(s);
            }
          });
        });
      }

      function setClipRange(newIn, newOut, seekSec, scrollCard) {
        const minSpan = 1.5;
        const clampedIn = Math.max(0, Math.min(newIn, ev.duration - minSpan));
        const clampedOut = Math.max(clampedIn + minSpan, Math.min(ev.duration, newOut));
        clipIn = clampedIn;
        clipOut = clampedOut;
        const active = exportQueue.find(c => c.id === activeClipId);
        if (active) {
          active.start = Number(clampedIn.toFixed(2));
          active.end = Number(clampedOut.toFixed(2));
          active.text = computeClipText(active.start, active.end);
          renderTimelineClips();
          renderExportQueue();
        } else {
          addClipRange(clampedIn, clampedOut);
        }
        renderTranscriptCards();
        if (typeof seekSec === 'number') {
          seekTo(seekSec);
        }
        if (scrollCard) {
          scrollTranscriptToActive();
        }
      }

      function findCueAtTime(sec) {
        return transcript.find(c => sec >= c.start && sec < c.end) ||
               transcript.find(c => sec >= c.end && sec <= c.end + 1.0) || null;
      }

      function updatePlayheadUI(curr) {
        const pct = Math.max(0, Math.min(100, (curr / ev.duration) * 100));
        playheadNeedle.style.left = pct + '%';
        stageTimecode.textContent = fmtTime(curr);
        timelineClockReadout.textContent = fmtTime(curr) + ' / ' + fmtTime(ev.duration);

        const activeCue = findCueAtTime(curr);
        liveSubtitleText.textContent = activeCue ? activeCue.text : '';
      }

      function renderExportQueue() {
        exportCountBadge.textContent = String(exportQueue.length);
        const allSelected = exportQueue.length > 0 && exportQueue.every(c => c.selected);
        selectAllDot.classList.toggle('checked', allSelected);

        if (!exportQueue.length) {
          exportClipsGrid.innerHTML = '<div style="grid-column:1/-1; padding:24px 8px; text-align:center; color:var(--ink-muted); font-size:12px;">Drag across the timeline to create In &amp; Out clips.</div>';
          updateDownloadButtonLabel();
          return;
        }

        exportClipsGrid.innerHTML = exportQueue.map(item => {
          const camObj = ev.cameras.find(c => c.id === item.cam) || ev.cameras[0];
          const midSec = (item.start + item.end) * 0.5;
          return '<div class="export-clip-card' + (item.selected ? ' selected' : '') + '" data-id="' + item.id + '">' +
            '<div class="export-card-thumb-wrap">' +
              '<img src="' + getThumbForTime(midSec) + '" alt="" />' +
              '<button type="button" class="export-card-select" data-action="toggle" aria-label="Select clip"></button>' +
              '<button type="button" class="export-card-remove" data-action="remove" aria-label="Remove clip">✕</button>' +
              '<span class="export-card-meta-pill">' + camObj.short + ' · ' + fmtTime(item.start) + '–' + fmtTime(item.end) + '</span>' +
            '</div>' +
            '<div class="export-card-caption"><div class="export-card-caption-text">' + item.text + '</div></div>' +
          '</div>';
        }).join('');

        exportClipsGrid.querySelectorAll('.export-clip-card').forEach(card => {
          const id = card.getAttribute('data-id');
          card.addEventListener('click', (e) => {
            const action = e.target.getAttribute('data-action');
            const item = exportQueue.find(x => x.id === id);
            if (!item) return;
            if (action === 'remove') {
              e.stopPropagation();
              removeClipById(id);
            } else if (action === 'toggle') {
              e.stopPropagation();
              item.selected = !item.selected;
              renderExportQueue();
            } else {
              selectCamera(item.cam, false);
              setActiveClip(item.id, true);
              seekTo(item.start);
              scrollTranscriptToActive();
              playbackMode = 'clip';
              playAllSynced();
            }
          });
        });

        updateDownloadButtonLabel();
      }

      function updateDownloadButtonLabel() {
        const selectedItems = exportQueue.filter(c => c.selected);
        const count = selectedItems.length || 1;
        const camShort = exportCam === 'all'
          ? '4 CAMS'
          : (ev.cameras.find(c => c.id === exportCam) || ev.cameras[0]).short;
        downloadClipsLabel.textContent =
          'Download ' + count + (count === 1 ? ' Clip' : ' Clips') + ' (' + camShort + ' • ' + exportArLabel + ' .MP4)';
      }

      function setExportDrawer(open) {
        exportOpen = open;
        clipperTop.classList.toggle('export-open', open);
        exportChevron.textContent = open ? '›' : '‹';
      }

      // Live Browser Exact-Range Canvas + MediaRecorder MP4 Capture (when toggled in Advanced)
      async function recordExactClipBlob(clip, camObj, arKey, burnCaptions, onPct) {
        const dimsMap = {
          '16x9': { w: 1280, h: 720 },
          '9x16': { w: 404, h: 720 },
          '5x4':  { w: 900, h: 720 },
          '1x1':  { w: 720, h: 720 }
        };
        const dims = dimsMap[arKey] || dimsMap['16x9'];
        const canvas = document.createElement('canvas');
        canvas.width = dims.w;
        canvas.height = dims.h;
        const ctx = canvas.getContext('2d');

        const offVid = document.createElement('video');
        offVid.src = camObj.src;
        offVid.crossOrigin = 'anonymous';
        offVid.playsInline = true;
        offVid.preload = 'auto';

        await new Promise((resolve, reject) => {
          offVid.onloadedmetadata = resolve;
          offVid.onerror = reject;
        });

        const dur = Math.max(1.5, Math.min(25, clip.end - clip.start));
        const startT = ev.trueIsoSync ? Math.min(offVid.duration - 0.5, clip.start) : (clip.start % offVid.duration);
        offVid.currentTime = startT;
        await new Promise((resolve) => {
          const done = () => { offVid.onseeked = null; resolve(); };
          offVid.onseeked = done;
          setTimeout(done, 400);
        });

        const stream = canvas.captureStream(30);
        let audioCtx = null;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const srcNode = audioCtx.createMediaElementSource(offVid);
          const destNode = audioCtx.createMediaStreamDestination();
          srcNode.connect(destNode);
          destNode.stream.getAudioTracks().forEach(t => stream.addTrack(t));
        } catch (e) {
          offVid.muted = true;
        }

        const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')
          ? 'video/mp4;codecs=avc1,mp4a.40.2'
          : (MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm');
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 3200000 });
        const chunks = [];
        rec.ondataavailable = (evData) => { if (evData.data && evData.data.size) chunks.push(evData.data); };

        let stopped = false;
        function drawFrame() {
          if (stopped) return;
          const vw = offVid.videoWidth || 1280;
          const vh = offVid.videoHeight || 720;
          const scale = Math.max(dims.w / vw, dims.h / vh);
          const sw = dims.w / scale;
          const sh = dims.h / scale;
          const sx = (vw - sw) * 0.5;
          const sy = (vh - sh) * 0.5;
          ctx.drawImage(offVid, sx, sy, sw, sh, 0, 0, dims.w, dims.h);

          if (burnCaptions) {
            const relSec = clip.start + Math.max(0, offVid.currentTime - startT);
            const cue = findCueAtTime(relSec);
            if (cue && cue.text) {
              const fontSize = Math.max(15, Math.round(dims.w * 0.028));
              ctx.font = '600 ' + fontSize + 'px sans-serif';
              ctx.textAlign = 'center';
              const maxW = dims.w * 0.86;
              const words = cue.text.split(' ');
              const lines = [];
              let line = '';
              words.forEach(w => {
                const test = line ? (line + ' ' + w) : w;
                if (ctx.measureText(test).width > maxW && line) {
                  lines.push(line);
                  line = w;
                } else {
                  line = test;
                }
              });
              if (line) lines.push(line);
              const baseY = dims.h - 32 - (lines.length - 1) * (fontSize + 6);
              lines.forEach((ln, idx) => {
                const y = baseY + idx * (fontSize + 6);
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(0,0,0,0.85)';
                ctx.strokeText(ln, dims.w * 0.5, y);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(ln, dims.w * 0.5, y);
              });
            }
          }
          const elapsed = Math.max(0, offVid.currentTime - startT);
          if (onPct) onPct(Math.min(99, Math.round((elapsed / dur) * 100)));
          requestAnimationFrame(drawFrame);
        }

        const blobPromise = new Promise(resolve => {
          rec.onstop = () => resolve({ blob: new Blob(chunks, { type: mime }), ext: mime.includes('mp4') ? 'mp4' : 'webm' });
        });

        rec.start(200);
        await offVid.play().catch(() => {});
        drawFrame();

        await new Promise(r => setTimeout(r, dur * 1000));
        stopped = true;
        offVid.pause();
        if (rec.state !== 'inactive') rec.stop();
        const res = await blobPromise;
        if (audioCtx) audioCtx.close().catch(() => {});
        return res;
      }

      // Real Client-Side Aspect-Cropped Video Export (uses pre-baked MP4s by default or live Canvas/MediaRecorder capture)
      async function exportSelectedClips() {
        const targets = exportQueue.filter(c => c.selected);
        const list = targets.length ? targets : [{ start: clipIn, end: clipOut, cam: selectedCam, text: liveSubtitleText.textContent }];
        const progressBox = document.getElementById('exportProgressBox');
        const progressBar = document.getElementById('exportProgressBar');
        const progressPct = document.getElementById('exportProgressPct');
        const progressText = document.getElementById('exportProgressText');
        const useLiveCapture = document.getElementById('liveTrimCheck') && document.getElementById('liveTrimCheck').checked;
        const burnCaps = document.getElementById('burnCaptionsCheck') && document.getElementById('burnCaptionsCheck').checked;

        downloadClipsBtn.disabled = true;
        progressBox.classList.add('active');
        progressBar.style.width = '10%';
        progressPct.textContent = '10%';

        const camsToExport = exportCam === 'all' ? ev.cameras.map(c => c.id) : [exportCam];
        let step = 0;
        const total = list.length * camsToExport.length;

        for (const clip of list) {
          for (const camId of camsToExport) {
            step++;
            const camObj = ev.cameras.find(c => c.id === camId) || ev.cameras[0];
            const cleanTitle = ev.title.replace(/[^a-zA-Z0-9]+/g, '-');
            const cleanCam = camObj.name.replace(/[^a-zA-Z0-9]+/g, '-');

            if (useLiveCapture && window.MediaRecorder) {
              progressText.textContent = 'Recording ' + camObj.short + ' (' + exportArLabel + ')...';
              const recorded = await recordExactClipBlob(clip, camObj, exportAr, burnCaps, (subPct) => {
                const overall = Math.round((((step - 1) + subPct / 100) / total) * 100);
                progressBar.style.width = overall + '%';
                progressPct.textContent = overall + '%';
              });
              const blobUrl = URL.createObjectURL(recorded.blob);
              const fname = cleanTitle + '_' + camId.toUpperCase() + '-' + cleanCam + '_' + exportAr + '_' +
                fmtTime(clip.start).replace(':', 'm') + 's-' + fmtTime(clip.end).replace(':', 'm') + 's.' + recorded.ext;
              const a = document.createElement('a');
              a.href = blobUrl;
              a.download = fname;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(blobUrl), 8000);
            } else {
              const pct = Math.round((step / total) * 100);
              progressText.textContent = 'Exporting ' + camObj.short + ' (' + exportArLabel + ')...';
              progressBar.style.width = pct + '%';
              progressPct.textContent = pct + '%';
              await new Promise(r => setTimeout(r, 240));

              const fileUrl = ev.exportUrl
                ? ev.exportUrl(camId, exportAr)
                : ('/media/exports/export_' + camId + '_' + exportAr + '.mp4');
              const fname = cleanTitle + '_' + camId.toUpperCase() + '-' + cleanCam + '_' + exportAr + '_' +
                fmtTime(clip.start).replace(':', 'm') + 's-' + fmtTime(clip.end).replace(':', 'm') + 's.mp4';

              const a = document.createElement('a');
              a.href = fileUrl;
              a.download = fname;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            }
          }
        }

        progressBar.style.width = '100%';
        progressPct.textContent = '100%';
        progressText.textContent = 'Export complete!';
        setTimeout(() => {
          progressBox.classList.remove('active');
          downloadClipsBtn.disabled = false;
        }, 1200);
      }

      // ==================== INTERACTION LISTENERS ====================
      toggleExportBtn.addEventListener('click', () => setExportDrawer(!exportOpen));
      document.getElementById('mobileExportBackdrop').addEventListener('click', () => setExportDrawer(false));

      selectAllBtn.addEventListener('click', () => {
        const allSelected = exportQueue.length > 0 && exportQueue.every(c => c.selected);
        exportQueue.forEach(c => { c.selected = !allSelected; });
        renderExportQueue();
      });

      exportAspectSelect.addEventListener('change', () => {
        const opt = exportAspectSelect.options[exportAspectSelect.selectedIndex];
        exportAr = exportAspectSelect.value;
        exportArLabel = opt.getAttribute('data-label');
        cropFrameLive.style.aspectRatio = opt.getAttribute('data-css');
        updateDownloadButtonLabel();
      });

      exportCamSelect.addEventListener('change', () => {
        exportCam = exportCamSelect.value;
        if (exportCam !== 'all') {
          selectCamera(exportCam, false);
        }
        updateCropPreviewSource();
        updateDownloadButtonLabel();
      });

      advancedToggleBtn.addEventListener('click', () => {
        const open = advancedDrawer.classList.toggle('open');
        if (open) {
          updateCropPreviewSource();
          cropPreviewVideo.play().catch(() => {});
        } else {
          cropPreviewVideo.pause();
        }
      });

      document.getElementById('showSpeakersCheck').addEventListener('change', (e) => {
        showSpeakers = e.target.checked;
        renderTranscriptCards();
      });

      downloadClipsBtn.addEventListener('click', exportSelectedClips);

      // Camera Switcher Popover
      camDropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = camSwitcherMenu.classList.toggle('open');
        camDropdownBtn.classList.toggle('open', open);
      });

      window.addEventListener('click', (e) => {
        if (!camSwitcherMenu.contains(e.target) && e.target !== camDropdownBtn) {
          camSwitcherMenu.classList.remove('open');
          camDropdownBtn.classList.remove('open');
        }
      });

      quadToggleMenuBtn.addEventListener('click', () => {
        quadMode = !quadMode;
        multicamCanvas.classList.toggle('quad-mode', quadMode);
        quadToggleMenuBtn.classList.toggle('active', quadMode);
        syncCamerasToTime(getCurrentTime(), true);
        camSwitcherMenu.classList.remove('open');
        camDropdownBtn.classList.remove('open');
      });

      multicamCanvas.querySelectorAll('.cam-feed-slot').forEach(slot => {
        slot.addEventListener('click', () => {
          const cid = slot.getAttribute('data-cam');
          if (quadMode) {
            selectCamera(cid, true);
          } else {
            if (isPaused()) playAllSynced();
            else pauseAllSynced();
          }
        });
      });

      // Play In -> Out vs Watch Full Stream
      playInOutBtn.addEventListener('click', () => {
        if (!isPaused() && playbackMode === 'clip') {
          pauseAllSynced();
        } else {
          if (!exportQueue.length) {
            const curr = getCurrentTime();
            addClipRange(curr, Math.min(ev.duration, curr + 10));
          }
          playbackMode = 'clip';
          const curr = getCurrentTime();
          if (curr < clipIn || curr >= clipOut - 0.2) {
            seekTo(clipIn);
          }
          playAllSynced();
        }
      });

      watchFullBtn.addEventListener('click', () => {
        if (!isPaused() && playbackMode === 'full') {
          pauseAllSynced();
        } else {
          playbackMode = 'full';
          playAllSynced();
        }
      });

      // Search Input
      searchInput.addEventListener('input', runSearch);
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        runSearch();
      });

      // Master Clock Tick & Drift Correction Loop
      function onClockTick() {
        if (dragMode) return;
        const curr = isPaused() ? desiredTime : getCurrentTime();
        if (!isPaused()) {
          desiredTime = curr;
          if (playbackMode === 'clip' && curr >= clipOut) {
            seekTo(clipIn);
            return;
          }
          syncCamerasToTime(curr, false);
        }
        updatePlayheadUI(curr);
      }

      masterMedia.addEventListener('timeupdate', onClockTick);
      vids.cam1.addEventListener('timeupdate', () => {
        if (ev.trueIsoSync) onClockTick();
      });
      masterMedia.addEventListener('play', updateTransportButtons);
      masterMedia.addEventListener('pause', updateTransportButtons);
      vids.cam1.addEventListener('play', updateTransportButtons);
      vids.cam1.addEventListener('pause', updateTransportButtons);

      // Multi-Range Timeline Scrubbing, Drag-to-Create, Resize & Slide
      let dragMode = null;
      let dragMoved = false;
      let dragStartX = 0;
      let dragAnchorSec = 0;
      let dragStartIn = 0;
      let dragStartOut = 0;
      let dragTargetId = null;
      let draftBracketEl = null;

      function secFromClientX(clientX) {
        const rect = timelineTrack.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        return ratio * ev.duration;
      }

      function updateBracketElementLive(el, startSec, endSec, isActive) {
        if (!el) return;
        const leftPct = (startSec / ev.duration) * 100;
        const widthPct = Math.max(1.4, ((endSec - startSec) / ev.duration) * 100);
        el.style.left = leftPct + '%';
        el.style.width = widthPct + '%';
        const pill = el.querySelector('.trim-range-pill');
        if (pill) {
          pill.textContent = formatBracketPillText(startSec, endSec, isActive);
        }
      }

      clipsLayer.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const bracket = e.target.closest('.trim-bracket');
        if (!bracket) return;
        const id = bracket.getAttribute('data-id');

        const removeBtn = e.target.closest('.trim-remove-btn');
        if (removeBtn) {
          e.stopPropagation();
          removeClipById(id);
          return;
        }

        const handle = e.target.closest('.trim-handle');
        if (handle) {
          e.stopPropagation();
          setActiveClip(id, true);
          dragTargetId = id;
          dragMode = handle.getAttribute('data-action'); // 'in' or 'out'
          dragMoved = false;
          return;
        }

        // Shift+drag inside an existing bracket draws a new overlapping bracket
        if (e.shiftKey) return;

        const clip = exportQueue.find(c => c.id === id);
        if (!clip) return;
        e.stopPropagation();
        setActiveClip(id, true);
        dragTargetId = id;
        dragMode = 'move';
        dragMoved = false;
        dragStartX = e.clientX;
        dragStartIn = clip.start;
        dragStartOut = clip.end;
        seekTo(secFromClientX(e.clientX));
      });

      timelineTrack.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.classList.contains('chapter-marker-label')) return;
        const targetSec = secFromClientX(e.clientX);
        if (targetSec < clipIn || targetSec >= clipOut - 0.1) {
          playbackMode = 'full';
          updateTransportButtons();
        }
        dragMode = 'pending-create';
        dragMoved = false;
        dragStartX = e.clientX;
        dragAnchorSec = targetSec;
        seekTo(targetSec);
      });

      window.addEventListener('mousemove', (e) => {
        const rect = timelineTrack.getBoundingClientRect();
        const overTrack = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top - 10 && e.clientY <= rect.bottom + 10;

        if (overTrack || dragMode) {
          const hSec = secFromClientX(e.clientX);
          const xPx = Math.max(96, Math.min(rect.width - 96, e.clientX - rect.left));
          hoverLoupe.style.left = xPx + 'px';
          hoverLoupe.classList.add('visible');
          loupeImg.src = getThumbForTime(hSec);
          loupeTime.textContent = fmtTime(hSec);
          const cue = findCueAtTime(hSec);
          loupeSpeaker.textContent = cue ? cue.speaker : '';
          loupeCaption.textContent = cue ? cue.text : '';
        } else {
          hoverLoupe.classList.remove('visible');
        }

        if (!dragMode) return;
        const sec = secFromClientX(e.clientX);
        const minSpan = 1.5;

        if (dragMode === 'pending-create') {
          if (Math.abs(e.clientX - dragStartX) >= 5) {
            dragMode = 'create';
            dragMoved = true;
            clipsLayer.querySelectorAll('.trim-bracket.is-active').forEach(b => b.classList.remove('is-active'));
            draftBracketEl = document.createElement('div');
            draftBracketEl.className = 'trim-bracket is-active';
            draftBracketEl.innerHTML =
              '<div class="trim-handle in">[</div>' +
              '<div class="trim-handle out">]</div>' +
              '<div class="trim-range-pill"></div>';
            clipsLayer.appendChild(draftBracketEl);
          } else {
            seekTo(sec);
            return;
          }
        }

        if (dragMode === 'create') {
          let s = Math.max(0, Math.min(dragAnchorSec, sec));
          let end = Math.min(ev.duration, Math.max(dragAnchorSec, sec));
          if (end - s < minSpan) {
            if (sec >= dragAnchorSec) end = Math.min(ev.duration, s + minSpan);
            else s = Math.max(0, end - minSpan);
          }
          updateBracketElementLive(draftBracketEl, s, end, true);
          seekTo(sec);
        } else if (dragMode === 'in') {
          dragMoved = true;
          const clip = exportQueue.find(c => c.id === dragTargetId);
          if (!clip) return;
          clip.start = Number(Math.max(0, Math.min(sec, clip.end - minSpan)).toFixed(2));
          clipIn = clip.start;
          clipOut = clip.end;
          const el = clipsLayer.querySelector('[data-id="' + dragTargetId + '"]');
          updateBracketElementLive(el, clip.start, clip.end, true);
          seekTo(clip.start);
        } else if (dragMode === 'out') {
          dragMoved = true;
          const clip = exportQueue.find(c => c.id === dragTargetId);
          if (!clip) return;
          clip.end = Number(Math.min(ev.duration, Math.max(sec, clip.start + minSpan)).toFixed(2));
          clipIn = clip.start;
          clipOut = clip.end;
          const el = clipsLayer.querySelector('[data-id="' + dragTargetId + '"]');
          updateBracketElementLive(el, clip.start, clip.end, true);
          seekTo(clip.end);
        } else if (dragMode === 'move') {
          if (Math.abs(e.clientX - dragStartX) >= 5) {
            dragMoved = true;
          }
          if (dragMoved) {
            const clip = exportQueue.find(c => c.id === dragTargetId);
            if (!clip) return;
            const delta = ((e.clientX - dragStartX) / rect.width) * ev.duration;
            const span = dragStartOut - dragStartIn;
            clip.start = Number(Math.max(0, Math.min(ev.duration - span, dragStartIn + delta)).toFixed(2));
            clip.end = Number((clip.start + span).toFixed(2));
            clipIn = clip.start;
            clipOut = clip.end;
            const el = clipsLayer.querySelector('[data-id="' + dragTargetId + '"]');
            updateBracketElementLive(el, clip.start, clip.end, true);
          }
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (!dragMode) return;
        const mode = dragMode;
        dragMode = null;
        const sec = secFromClientX(e.clientX);

        if (mode === 'pending-create') {
          seekTo(sec);
        } else if (mode === 'create') {
          if (draftBracketEl && draftBracketEl.parentNode) {
            draftBracketEl.parentNode.removeChild(draftBracketEl);
          }
          draftBracketEl = null;
          addClipRange(dragAnchorSec, sec);
          seekTo(sec);
        } else if (mode === 'move' && !dragMoved) {
          seekTo(sec);
        } else if (mode === 'in' || mode === 'out' || (mode === 'move' && dragMoved)) {
          const clip = exportQueue.find(c => c.id === dragTargetId);
          if (clip) {
            clip.text = computeClipText(clip.start, clip.end);
          }
          exportQueue.sort((a, b) => a.start - b.start);
          renderTimelineClips();
          renderExportQueue();
          renderTranscriptCards();
        }
        dragTargetId = null;
      });

      // Keyboard Shortcuts (Space, I, O, Backspace/Delete, 1-4, M, E)
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === searchInput) return;
        if (e.code === 'Space') {
          e.preventDefault();
          if (isPaused()) playAllSynced();
          else pauseAllSynced();
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
          if (activeClipId) {
            e.preventDefault();
            removeClipById(activeClipId);
          }
        } else if (e.key === 'i' || e.key === 'I') {
          const curr = getCurrentTime();
          if (activeClipId && curr < clipOut - 1.5) {
            setClipRange(curr, clipOut);
          } else {
            addClipRange(curr, Math.min(ev.duration, curr + 10));
          }
        } else if (e.key === 'o' || e.key === 'O') {
          const curr = getCurrentTime();
          if (activeClipId && curr > clipIn + 1.5) {
            setClipRange(clipIn, curr);
          } else {
            addClipRange(Math.max(0, curr - 10), curr);
          }
        } else if (['1', '2', '3', '4'].includes(e.key)) {
          const cam = ev.cameras[parseInt(e.key, 10) - 1];
          if (cam) selectCamera(cam.id, true);
        } else if (e.key === 'm' || e.key === 'M') {
          quadToggleMenuBtn.click();
        } else if (e.key === 'e' || e.key === 'E') {
          setExportDrawer(!exportOpen);
        }
      });

      // Boot synchronized 4-camera live event immediately
      loadEvent(activeEventKey);
    })();
  </script>
</body>
</html>
